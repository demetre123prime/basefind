name: Build NexCode for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['README.md']
permissions:
  contents: write
concurrency:
  group: nexcode-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Create Windows app icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 256,256
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(15,18,28))
          $font = New-Object System.Drawing.Font("Arial", 112, [System.Drawing.FontStyle]::Bold)
          $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(115,140,255))
          $g.DrawString("N", $font, $brush, 48, 42)
          New-Item -ItemType Directory -Force src-tauri/icons | Out-Null
          $bmp.Save("$PWD/src-tauri/icons/icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $stream = [System.IO.File]::Create("$PWD/src-tauri/icons/icon.ico")
          $icon = [System.Drawing.Icon]::FromHandle($bmp.GetHicon())
          $icon.Save($stream)
          $stream.Close()
          $g.Dispose()
          $bmp.Dispose()
      - name: Cache Rust dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: nexcode-cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: |
            nexcode-cargo-${{ runner.os }}-
      - name: Install dependencies
        run: npm install
      - name: Download bundled 0.5B starter model
        shell: pwsh
        run: |
          $modelDir = "src-tauri/resources/models"
          New-Item -ItemType Directory -Force $modelDir | Out-Null
          $modelPath = Join-Path $modelDir "qwen2.5-coder-0.5b-instruct-q4_k_m.gguf"
          $modelUrl = "https://huggingface.co/Qwen/Qwen2.5-Coder-0.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf"
          curl.exe --location --fail --retry 3 --retry-delay 5 $modelUrl --output $modelPath
          if ($LASTEXITCODE -ne 0) { throw "Could not download the 491 MB Qwen starter model." }
          $modelSize = (Get-Item $modelPath).Length
          if ($modelSize -lt 450000000) { throw "Starter model download is incomplete ($modelSize bytes)." }
          Write-Host "Bundled starter model: $modelSize bytes"
      - name: Build Windows installer
        run: npm run tauri:build
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexCode-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Publish direct EXE download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexcode-v0.3.0-build${{ github.run_number }}
          name: NexCode v0.3.0 for Windows · Build ${{ github.run_number }}
          make_latest: true
          files: src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
